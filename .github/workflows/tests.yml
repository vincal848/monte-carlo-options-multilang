name: tests

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest tests -q

  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Check toolchains
        run: |
          Rscript --version
          g++ --version
      - name: Test
        env:
          REQUIRE_TOOLCHAINS: "1"
        run: pytest tests/test_cross_language.py -q
